<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DropFlow</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    #organization-preview,
    #organization-action {
    scroll-margin-top: 20px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #0f1115;
      color: #ffffff;
      min-height: 100vh;
      padding: 50px 30px;
    }

    .container {
      text-align: center;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .logo {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 18px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #9ca3af;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .choose-button {
      border: none;
      background: #ffffff;
      color: #111111;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease;
      margin: 5px;
    }

    .choose-button:hover {
      opacity: 0.85;
    }

    .choose-button:active {
      transform: translateY(1px);
    }

    .choose-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .notice {
      margin-top: 22px;
      color: #6b7280;
      font-size: 14px;
    }

    .selected-folder {
      margin-top: 18px;
      color: #9ca3af;
      font-size: 14px;
      word-break: break-all;
    }

    #scan-results {
      margin-top: 35px;
      text-align: left;
    }

    #scan-results h2 {
      margin-bottom: 18px;
      font-size: 22px;
    }

    .file-table {
      width: 100%;
      border: 1px solid #252a33;
      border-radius: 12px;
      overflow: hidden;
      background: #13161c;
    }

    .file-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 15px;
      padding: 14px 18px;
      border-bottom: 1px solid #252a33;
      color: #d1d5db;
    }

    .file-row:last-child {
      border-bottom: none;
    }

    .file-header {
      font-weight: 600;
      color: #ffffff;
      background: #181b21;
    }

    .file-row span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #file-controls {
  display: flex;
  gap: 12px;
  margin: 25px 0 15px;
  text-align: left;
}

#file-search,
#category-filter {
  background: #181b21;
  color: #ffffff;
  border: 1px solid #252a33;
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s ease;
}

#file-search {
  flex: 1;
}

#category-filter {
  width: 190px;
  cursor: pointer;
}

#file-search:focus,
#category-filter:focus {
  border-color: #4b5563;
}

#category-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin: 28px 0 22px;
  text-align: left;
}

.category-card {
  background: #181b21;
  border: 1px solid #252a33;
  border-radius: 10px;
  padding: 18px 16px;
  cursor: pointer;
  transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1),
              border-color 0.2s ease,
              box-shadow 0.2s ease;
}

.category-card:hover {
  transform: translateY(-3px);
  border-color: #3a4150;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
}

.category-name {
  color: #9ca3af;
  font-size: 13px;
  letter-spacing: 0.02em;
  margin-bottom: 6px;
}

.category-count {
  font-size: 25px;
  font-weight: 650;
  letter-spacing: -0.01em;
}

#organization-preview {
  margin-top: 35px;
  text-align: left;
}

.preview-header {
  margin-bottom: 18px;
}

.preview-header h2 {
  margin-bottom: 6px;
}

.preview-subtitle {
  color: #9ca3af;
  font-size: 14px;
}

.preview-table {
  width: 100%;
  border: 1px solid #252a33;
  border-radius: 12px;
  overflow: hidden;
  background: #13161c;
}

.preview-row {
  display: grid;
  grid-template-columns: 1.5fr 1fr 2fr;
  gap: 15px;
  padding: 14px 18px;
  border-bottom: 1px solid #252a33;
  color: #d1d5db;
}

.preview-row:last-child {
  border-bottom: none;
}

.preview-header-row {
  font-weight: 600;
  color: #ffffff;
  background: #181b21;
}

.preview-row span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.preview-category {
  color: #9ca3af;
}

.preview-destination {
  color: #9ca3af;
  font-size: 13px;
}

.preview-warning {
  margin-top: 8px;
  color: #f59e0b;
  font-size: 14px;
}

.preview-success {
  margin-top: 8px;
  color: #9ca3af;
  font-size: 14px;
}

.preview-ready {
  color: #9ca3af;
}

.preview-conflict {
  color: #f59e0b;
  font-weight: 600;
}

#organization-action {
  margin-top: 25px;
  text-align: center;
}

.organization-confirmation {
  padding: 20px;
  border: 1px solid #252a33;
  border-radius: 12px;
  background: #181b21;
}

.organization-confirmation p {
  color: #9ca3af;
  margin-bottom: 16px;
}

.cancel-button {
  border: 1px solid #252a33;
  background: transparent;
  color: #ffffff;
  padding: 12px 20px;
  border-radius: 10px;
  cursor: pointer;
  margin-right: 8px;
}

.confirm-button {
  border: none;
  background: #ffffff;
  color: #111111;
  padding: 12px 20px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
}

.button-area {
  position: sticky;
  top: 0;
  z-index: 10;
  padding: 15px 0;
  background: #0f1115;
}

.preview-summary {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin: 20px 0;
}

.preview-summary-card {
  background: #181b21;
  border: 1px solid #252a33;
  border-radius: 10px;
  padding: 14px;
}

.preview-summary-label {
  display: block;
  color: #9ca3af;
  font-size: 12px;
  margin-bottom: 6px;
}

.preview-summary-card strong {
  font-size: 24px;
}

@media (max-width: 800px) {
  .preview-summary {
    grid-template-columns: repeat(2, 1fr);
  }
}
  </style>
</head>

<body>

  <main class="container">
    <div class="logo">DropFlow</div>

    <p class="subtitle">
      Keep your files organized.<br>
      Automatically.
    </p>

    <div class="button-area">

    <button class="choose-button" id="choose-folder">
      Choose Folder
    </button>

    <button class="choose-button" id="scan-folder" style="display: none;">
      Scan Folder
    </button>

    <button class="choose-button" id="preview-organization" style="display: none;">
      Preview Organization
    </button>

    <button class="choose-button" id="organize-files" style="display: none;">
      Organize Files
    </button>

    </div>

    <p class="selected-folder" id="selected-folder"></p>

    <div id="category-summary"></div>
    <div id="file-controls" style="display: none;">
  <input type="text" id="file-search" placeholder="Search files...">

  <select id="category-filter">
    <option value="All">All categories</option>
    <option value="Documents">Documents</option>
    <option value="Images">Images</option>
    <option value="Videos">Videos</option>
    <option value="Archives">Archives</option>
    <option value="Installers">Installers</option>
    <option value="Other">Other</option>
  </select>
</div>

<div id="scan-results"></div>
<div id="organization-preview"></div>
<div id="organization-action"></div>

    <p class="notice">
      No files will be changed yet.
    </p>
  </main>

  <script>
    const chooseButton = document.getElementById("choose-folder");
    const scanButton = document.getElementById("scan-folder");
    const selectedFolder = document.getElementById("selected-folder");
    const scanResults = document.getElementById("scan-results");
    const fileControls = document.getElementById("file-controls");
    const fileSearch = document.getElementById("file-search");
    const categoryFilter = document.getElementById("category-filter");
    const categorySummary = document.getElementById("category-summary");
    const previewButton =document.getElementById("preview-organization");
    const organizationPreview = document.getElementById("organization-preview");
    const organizeButton = document.getElementById("organize-files");
    const organizationAction = document.getElementById("organization-action");

    let scannedFiles = [];

    let currentFolder = null;

    function fileRow(cells) {
      const spans = cells.map(cell => `<span title="${cell}">${cell}</span>`).join("");
      return `<div class="file-row">${spans}</div>`;
    }

    function fileRow(cells) {
        const spans = cells.map(cell => `<span title="${cell}">${cell}</span>`).join("");
        return `<div class="file-row">${spans}</div>`;
    }
    
    function renderCategorySummary() {
      const categories = {
        Documents: 0,
        Images: 0,
        Videos: 0,
        Archives: 0,
        Installers: 0,
        Other: 0
      };

      for (const file of scannedFiles) {
        if (categories[file.category] !== undefined) {
          categories[file.category]++;
        }
      }

      categorySummary.innerHTML = Object.entries(categories)
        .map(([category, count]) => `
          <div class="category-card" data-category="${category}">
          <div class="category-name">${category}</div>
          <div class="category-count">${count}</div>
          </div>
        `)
      .join("");

      document.querySelectorAll(".category-card").forEach(card => {
        card.addEventListener("click", () => {
        categoryFilter.value = card.dataset.category;
        renderFiles();
      });
      });
    }

    function renderFiles() {
        const searchText = fileSearch.value.toLowerCase().trim();
        const selectedCategory = categoryFilter.value;

        const filteredFiles = scannedFiles.filter(file => {
        const matchesSearch = file.name.toLowerCase().includes(searchText);
        const matchesCategory = selectedCategory === "All" || file.category === selectedCategory;

        return matchesSearch && matchesCategory;
        });

        const header = fileRow(["File name", "Type", "Category", "Size"]);
        const rows = filteredFiles.length
        ? filteredFiles.map(file => fileRow([file.name, file.extension, file.category, file.size])).join("")
        : fileRow(["No matching files", "-", "-", "-"]);

        scanResults.innerHTML = `
        <h2>
            ${filteredFiles.length} files shown
            <span style="color: #6b7280; font-size: 14px;">(${scannedFiles.length} total)</span>
        </h2>

        <div class="file-table">
        <div class="file-row file-header">${header.replace(/<div class="file-row">|<\/div>/g, "")}</div>
        ${rows}
        </div>
        `;
    }

async function showOrganizationPreview() {
  if (!currentFolder) {
    organizationPreview.innerHTML = `
      <div class="preview-header">
        <h2>No folder selected</h2>
        <p class="preview-subtitle">
          Please choose a folder first.
        </p>
      </div>
    `;
    return;
  }

  previewButton.textContent = "Creating Preview...";
  previewButton.disabled = true;

  try {
    console.log(
      "Checking organization conflicts for:",
      currentFolder
    );

    const plan =
      await window.dropflow.checkOrganizationConflicts(
        currentFolder
      );

    console.log("Organization plan:", plan);

    const alreadyOrganized = plan.filter(
      file => file.status === "organized"
    );

    const misplacedFiles = plan.filter(
      file => file.status === "misplaced"
    );

    const conflictFiles = plan.filter(
      file => file.conflict
    );

    const readyFiles = plan.filter(
      file =>
        file.status !== "organized" &&
        !file.conflict
    );

    organizationPreview.innerHTML = `
      <div class="preview-header">

        <h2>Organization Preview</h2>

        <p class="preview-subtitle">
          ${plan.length} files scanned.
          Nothing will be changed.
        </p>

        <div class="preview-summary">

          <div class="preview-summary-card">
            <span class="preview-summary-label">
              Already organized
            </span>

            <strong class="preview-organized">
              ${alreadyOrganized.length}
            </strong>
          </div>

          <div class="preview-summary-card">
            <span class="preview-summary-label">
              Ready to move
            </span>

            <strong class="preview-ready">
              ${readyFiles.length}
            </strong>
          </div>

          <div class="preview-summary-card">
            <span class="preview-summary-label">
              Misplaced
            </span>

            <strong class="preview-misplaced">
              ${misplacedFiles.length}
            </strong>
          </div>

          <div class="preview-summary-card">
            <span class="preview-summary-label">
              Conflicts
            </span>

            <strong class="preview-conflict">
              ${conflictFiles.length}
            </strong>
          </div>

        </div>

        ${
          conflictFiles.length > 0
            ? `
              <p class="preview-warning">
                ⚠ ${conflictFiles.length}
                ${
                  conflictFiles.length === 1
                    ? "conflict"
                    : "conflicts"
                } found.
                These files will not be overwritten.
              </p>
            `
            : `
              <p class="preview-success">
                ✓ No conflicts found.
              </p>
            `
        }

      </div>

      <div class="preview-table">

        <div class="preview-row preview-header-row">
          <span>File</span>
          <span>Category</span>
          <span>Status</span>
        </div>

        ${
          plan.length
            ? plan.map(file => {

                let statusText = "→ Ready";
                let statusClass = "preview-ready";

                if (file.status === "organized") {
                  statusText = "✓ Already organized";
                  statusClass = "preview-organized";

                } else if (file.conflict) {
                  statusText = "⚠ Conflict";
                  statusClass = "preview-conflict";

                } else if (file.status === "misplaced") {
                  statusText = "⚠ Misplaced";
                  statusClass = "preview-misplaced";
                }

                return `
                  <div class="preview-row">

                    <span title="${file.name}">
                      ${file.name}
                    </span>

                    <span class="preview-category">
                      ${file.category}
                    </span>

                    <span class="${statusClass}">
                      ${statusText}
                    </span>

                  </div>
                `;
              }).join("")
            : `
              <div class="preview-row">
                <span>No files found</span>
                <span>-</span>
                <span>-</span>
              </div>
            `
        }

      </div>
    `;

    organizationPreview.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  } catch (error) {
    console.error("Preview failed:", error);

    organizationPreview.innerHTML = `
      <div class="preview-header">

        <h2>Preview failed</h2>

        <p class="preview-subtitle">
          ${
            error.message ||
            "Could not create organization preview."
          }
        </p>

      </div>
    `;

    organizationPreview.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  } finally {
    previewButton.textContent =
      "Preview Organization";

    previewButton.disabled = false;
  }
}

async function showOrganizationConfirmation() {
  if (!currentFolder || scannedFiles.length === 0) {
    return;
  }

  organizationAction.innerHTML = `
    <div class="organization-confirmation">

      <p>
        DropFlow is ready to organize
        ${scannedFiles.length} files.
      </p>

      <p>
        Files will be placed into their category folders.
        Existing files will not be overwritten.
      </p>

      <button class="cancel-button" id="cancel-organization">
        Cancel
      </button>

      <button class="confirm-button" id="confirm-organization">
        Continue
      </button>

    </div>
  `;

  organizationAction.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

  document
    .getElementById("cancel-organization")
    .addEventListener("click", () => {
      organizationAction.innerHTML = "";
    });

  document
    .getElementById("confirm-organization")
    .addEventListener("click", async () => {

      const confirmButton =
        document.getElementById("confirm-organization");

      const cancelButton =
        document.getElementById("cancel-organization");

      confirmButton.disabled = true;
      cancelButton.disabled = true;

      confirmButton.textContent = "Organizing...";

      try {
        const plan =
          await window.dropflow.checkOrganizationConflicts(
            currentFolder
          );

        const safeFiles =
          plan.filter(file => !file.conflict);

        const conflictFiles =
          plan.filter(file => file.conflict);

        let movedCount = 0;
        let failedCount = 0;

        organizationAction.innerHTML = `
          <div class="organization-confirmation">

            <h2>Organizing Files</h2>

            <p id="organization-progress">
              Starting...
            </p>

            <p id="organization-status">
              Preparing files...
            </p>

          </div>
        `;

        for (const file of safeFiles) {

          const result =
            await window.dropflow.moveFileSafely(file);

          if (result.success) {
            movedCount++;
          } else {
            failedCount++;
          }

          document.getElementById(
            "organization-progress"
          ).textContent =
            `${movedCount + failedCount} / ${safeFiles.length} files processed`;

          document.getElementById(
            "organization-status"
          ).textContent =
            `Processing: ${file.name}`;
        }

        organizationAction.innerHTML = `
          <div class="organization-confirmation">

            <h2>✓ Organization Complete</h2>

            <p>
              ${movedCount} files moved successfully.
            </p>

            <p>
              ${conflictFiles.length} files skipped because
              they already exist in the destination.
            </p>

            <p>
              ${failedCount} files could not be moved.
            </p>

          </div>
        `;

      } catch (error) {

        console.error(
          "Organization failed:",
          error
        );

        organizationAction.innerHTML = `
          <div class="organization-confirmation">

            <h2>Organization Failed</h2>

            <p>
              ${
                error.message ||
                "Something went wrong while organizing files."
              }
            </p>

          </div>
        `;
      }
    });
}

    previewButton.addEventListener(
    "click",
    showOrganizationPreview
    );

    chooseButton.addEventListener("click", async () => {
      const folder = await window.dropflow.chooseFolder();
      if (!folder) return;

      currentFolder = folder;
      selectedFolder.textContent = `Selected: ${folder}`;
      scanButton.style.display = "inline-block";
      scanResults.innerHTML = "";
      previewButton.style.display = "none";
      organizationPreview.innerHTML = "";
      organizeButton.style.display = "none";
      organizationAction.innerHTML = "";
    });

    organizeButton.addEventListener(
  "click",
  showOrganizationConfirmation
);

    scanButton.addEventListener("click", async () => {
      if (!currentFolder) return;

      scanButton.textContent = "Scanning...";
      scanButton.disabled = true;

      try {
        const files = await window.dropflow.scanFolder(currentFolder);
        scannedFiles = files;
        categorySummary.style.display = "grid";
        fileControls.style.display = "flex";
        renderCategorySummary();
        renderFiles();
        previewButton.style.display = "inline-block";
        organizationPreview.innerHTML = "";
        organizeButton.style.display = "inline-block";
        organizationAction.innerHTML = "";


        const header = fileRow(["File name", "Type", "Category", "Size"]);
        const rows = files.length
          ? files.map(file => fileRow([file.name, file.extension, file.category, file.size])).join("")
          : fileRow(["No files found", "-", "-", "-"]);

        scanResults.innerHTML = `
          <h2>${files.length} files found</h2>
          <div class="file-table">
            <div class="file-row file-header">${header.replace(/<div class="file-row">|<\/div>/g, "")}</div>
            ${rows}
          </div>
        `;
      } catch (error) {
        console.error(error);
        scanResults.innerHTML = "<p>Could not scan this folder.</p>";
      } finally {
        scanButton.textContent = "Scan Folder";
        scanButton.disabled = false;
      }
    });

    fileSearch.addEventListener("input", renderFiles);

    categoryFilter.addEventListener("change", renderFiles);
  </script>

</body>
</html>
